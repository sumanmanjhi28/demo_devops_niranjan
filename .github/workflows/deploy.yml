name: Terraform EKS + Deploy to Kubernetes

on:
  workflow_dispatch:
    inputs:
      action:
        description: Select whether to apply or destroy infrastructure
        required: true
        default: apply
        type: choice
        options:
          - apply
          - destroy
      deploy_app:
        description: Deploy app after infrastructure is ready
        required: false
        default: true
        type: boolean

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: ./Terraform
  EKS_CLUSTER_NAME: demo-devops-eks
  ECR_REPOSITORY: demo-devops

jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      eks_cluster_name: ${{ steps.tf-outputs.outputs.eks_cluster }}
      ecr_repository: ${{ steps.tf-outputs.outputs.ecr_repo }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Backend (Auto-create if needed)
        id: setup-backend
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="demo-devops-terraform-state-${ACCOUNT_ID}"
          TABLE_NAME="demo-devops-terraform-locks"
          
          echo "========================================="
          echo "Backend Setup"
          echo "========================================="
          echo "S3 Bucket: $BUCKET_NAME"
          echo "DynamoDB Table: $TABLE_NAME"
          echo ""
          
          # Check if backend exists
          BUCKET_EXISTS=false
          TABLE_EXISTS=false
          
          if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "✓ S3 bucket already exists"
            BUCKET_EXISTS=true
          fi
          
          if aws dynamodb describe-table --table-name "$TABLE_NAME" --region ${{ env.AWS_REGION }} 2>/dev/null; then
            echo "✓ DynamoDB table already exists"
            TABLE_EXISTS=true
          fi
          
          # Create backend if it doesn't exist
          if [ "$BUCKET_EXISTS" = false ] || [ "$TABLE_EXISTS" = false ]; then
            echo ""
            echo "Creating backend resources..."
            echo ""
            
            # Create S3 bucket
            if [ "$BUCKET_EXISTS" = false ]; then
              echo "1. Creating S3 bucket..."
              aws s3api create-bucket \
                --bucket "$BUCKET_NAME" \
                --region ${{ env.AWS_REGION }}
              
              # Enable versioning
              aws s3api put-bucket-versioning \
                --bucket "$BUCKET_NAME" \
                --versioning-configuration Status=Enabled
              
              # Enable encryption
              aws s3api put-bucket-encryption \
                --bucket "$BUCKET_NAME" \
                --server-side-encryption-configuration '{
                  "Rules": [{
                    "ApplyServerSideEncryptionByDefault": {
                      "SSEAlgorithm": "AES256"
                    },
                    "BucketKeyEnabled": true
                  }]
                }'
              
              # Block public access
              aws s3api put-public-access-block \
                --bucket "$BUCKET_NAME" \
                --public-access-block-configuration \
                  BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
              
              echo "✓ S3 bucket created"
            fi
            
            # Create DynamoDB table
            if [ "$TABLE_EXISTS" = false ]; then
              echo "2. Creating DynamoDB table..."
              aws dynamodb create-table \
                --table-name "$TABLE_NAME" \
                --attribute-definitions AttributeName=LockID,AttributeType=S \
                --key-schema AttributeName=LockID,KeyType=HASH \
                --billing-mode PAY_PER_REQUEST \
                --region ${{ env.AWS_REGION }}
              
              # Wait for table to be active
              echo "Waiting for table to be active..."
              for i in {1..30}; do
                STATUS=$(aws dynamodb describe-table --table-name "$TABLE_NAME" --region ${{ env.AWS_REGION }} --query "Table.TableStatus" --output text 2>/dev/null || echo "")
                if [ "$STATUS" == "ACTIVE" ]; then
                  echo "✓ Table is active"
                  break
                fi
                echo "  Waiting... (attempt $i/30)"
                sleep 5
              done
              
              # Enable point-in-time recovery
              aws dynamodb update-continuous-backups \
                --table-name "$TABLE_NAME" \
                --point-in-time-recovery-specification PointInTimeRecoveryEnabled=true \
                --region ${{ env.AWS_REGION }} 2>/dev/null || true
              
              echo "✓ DynamoDB table created"
            fi
            
            echo ""
            echo "✓ Backend setup complete!"
          else
            echo ""
            echo "✓ Backend already configured and ready!"
          fi
          
          echo ""
          echo "========================================="

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform plan
        if: inputs.action == 'apply'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -out=tfplan

      - name: Terraform apply
        if: inputs.action == 'apply'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan

      - name: Get Terraform Outputs
        if: inputs.action == 'apply'
        id: tf-outputs
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "eks_cluster=$(terraform output -raw eks_cluster_name)" >> $GITHUB_OUTPUT
          echo "ecr_repo=$(terraform output -raw ecr_repository_url)" >> $GITHUB_OUTPUT

      - name: Cleanup Kubernetes Resources (before destroy)
        if: inputs.action == 'destroy'
        continue-on-error: true
        run: |
          echo "========================================="
          echo "Cleaning up Kubernetes resources..."
          echo "========================================="
          
          # Try to connect to EKS cluster
          if aws eks describe-cluster --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }} 2>/dev/null; then
            echo "Updating kubeconfig..."
            aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}
            
            echo "Deleting LoadBalancer service (releases AWS Load Balancer)..."
            kubectl delete service demo-devops-service -n default --ignore-not-found=true --timeout=5m
            
            echo "Deleting deployment..."
            kubectl delete deployment demo-devops-app -n default --ignore-not-found=true --timeout=2m
            
            echo ""
            echo "Waiting for AWS Load Balancer to be fully released..."
            echo "This is necessary to allow Terraform to destroy VPC resources..."
            
            # Wait up to 3 minutes for load balancer to be deleted
            for i in {1..36}; do
              LB_COUNT=$(aws elbv2 describe-load-balancers --query "LoadBalancers[?VpcId=='vpc-0f9dc44898df8fe19'] | length(@)" --output text 2>/dev/null || echo "0")
              CLB_COUNT=$(aws elb describe-load-balancers --query "LoadBalancerDescriptions[?VPCId=='vpc-0f9dc44898df8fe19'] | length(@)" --output text 2>/dev/null || echo "0")
              
              if [ "$LB_COUNT" = "0" ] && [ "$CLB_COUNT" = "0" ]; then
                echo "✓ Load Balancer fully released!"
                break
              fi
              
              echo "  Waiting... (attempt $i/36) - LBs remaining: $((LB_COUNT + CLB_COUNT))"
              sleep 5
            done
            
            echo "✓ Kubernetes resources cleaned up"
          else
            echo "⚠️  EKS cluster not found or already deleted, skipping k8s cleanup"
          fi
          
          echo "========================================="

      - name: Terraform destroy
        if: inputs.action == 'destroy'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "Starting Terraform destroy..."
          terraform destroy -auto-approve
          
          # If destroy fails due to dependencies, wait and retry once
          if [ $? -ne 0 ]; then
            echo ""
            echo "⚠️  Terraform destroy failed, waiting 30s and retrying..."
            echo "This can happen if AWS resources are still being released..."
            sleep 30
            
            echo "Retrying terraform destroy..."
            terraform destroy -auto-approve
          fi

      - name: Destroy Backend (Auto-cleanup)
        if: inputs.action == 'destroy'
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="demo-devops-terraform-state-${ACCOUNT_ID}"
          TABLE_NAME="demo-devops-terraform-locks"
          
          echo "========================================="
          echo "Destroying Backend Resources"
          echo "========================================="
          echo "S3 Bucket: $BUCKET_NAME"
          echo "DynamoDB Table: $TABLE_NAME"
          echo ""
          
          # Check if resources exist
          BUCKET_EXISTS=false
          TABLE_EXISTS=false
          
          if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            BUCKET_EXISTS=true
          fi
          
          if aws dynamodb describe-table --table-name "$TABLE_NAME" --region ${{ env.AWS_REGION }} 2>/dev/null; then
            TABLE_EXISTS=true
          fi
          
          if [ "$BUCKET_EXISTS" = false ] && [ "$TABLE_EXISTS" = false ]; then
            echo "⚠️  Backend resources already deleted!"
            echo "========================================="
            exit 0
          fi
          
          # Empty and delete S3 bucket
          if [ "$BUCKET_EXISTS" = true ]; then
            echo "1. Emptying S3 bucket..."
            aws s3 rm "s3://$BUCKET_NAME" --recursive || true
            
            echo "2. Deleting object versions..."
            aws s3api delete-objects \
              --bucket "$BUCKET_NAME" \
              --delete "$(aws s3api list-object-versions \
                --bucket "$BUCKET_NAME" \
                --output=json \
                --query='{Objects: Versions[].{Key:Key,VersionId:VersionId}}' 2>/dev/null || echo '{}')" 2>/dev/null || true
            
            aws s3api delete-objects \
              --bucket "$BUCKET_NAME" \
              --delete "$(aws s3api list-object-versions \
                --bucket "$BUCKET_NAME" \
                --output=json \
                --query='{Objects: DeleteMarkers[].{Key:Key,VersionId:VersionId}}' 2>/dev/null || echo '{}')" 2>/dev/null || true
            
            echo "3. Deleting S3 bucket..."
            aws s3api delete-bucket --bucket "$BUCKET_NAME" --region ${{ env.AWS_REGION }} || true
            echo "✓ S3 bucket deleted"
          fi
          
          # Delete DynamoDB table
          if [ "$TABLE_EXISTS" = true ]; then
            echo "4. Deleting DynamoDB table..."
            aws dynamodb delete-table --table-name "$TABLE_NAME" --region ${{ env.AWS_REGION }} || true
            echo "✓ DynamoDB table deleted"
          fi
          
          echo ""
          echo "========================================="
          echo "✓ Backend destroyed successfully!"
          echo "========================================="

      - name: Post-Destroy Summary
        if: inputs.action == 'destroy'
        run: |
          echo "## Complete Cleanup Successful! ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Resources Destroyed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ EKS Cluster" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Node Groups" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ VPC & Networking" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ IAM Roles" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ ECR Repository" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ S3 Bucket (terraform state)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ DynamoDB Table (state locks)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎉 **AWS account is now completely clean!**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Cost Impact" >> $GITHUB_STEP_SUMMARY
          echo "- Monthly savings: ~\$100/month (EKS + nodes)" >> $GITHUB_STEP_SUMMARY
          echo "- Current cost: \$0/month" >> $GITHUB_STEP_SUMMARY

  build-and-deploy:
    if: inputs.action == 'apply' && inputs.deploy_app == true
    needs: terraform
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build Docker image
          docker build -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG .
          docker build -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest .
          
          # Push image to ECR
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest
          
          echo "image=$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Deploy to EKS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Replace image in deployment
          export ECR_REPOSITORY_URL=$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}
          envsubst < k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml

      - name: Wait for deployment
        run: |
          kubectl rollout status deployment/demo-devops-app -n default --timeout=5m

      - name: Get Load Balancer URL
        id: get-url
        run: |
          echo "Waiting for Load Balancer to be provisioned..."
          for i in {1..30}; do
            LB_URL=$(kubectl get service demo-devops-service -n default -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
            if [ ! -z "$LB_URL" ]; then
              echo "url=$LB_URL" >> $GITHUB_OUTPUT
              echo "Application URL: http://$LB_URL"
              break
            fi
            echo "Attempt $i: Load Balancer not ready yet..."
            sleep 10
          done

      - name: Deployment Summary
        run: |
          echo "## EKS Deployment Successful! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Cluster Details" >> $GITHUB_STEP_SUMMARY
          echo "- **EKS Cluster**: ${{ env.EKS_CLUSTER_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **ECR Image**: ${{ steps.build-image.outputs.image }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Application URL**: http://${{ steps.get-url.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Kubernetes Resources" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          kubectl get pods -n default >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          kubectl get services -n default >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
