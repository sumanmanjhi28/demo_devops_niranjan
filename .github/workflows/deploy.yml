name: Terraform EKS + Deploy to Kubernetes

on:
  workflow_dispatch:
    inputs:
      action:
        description: Select whether to apply or destroy infrastructure
        required: true
        default: apply
        type: choice
        options:
          - apply
          - destroy
      deploy_app:
        description: Deploy app after infrastructure is ready
        required: false
        default: true
        type: boolean

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: ./Terraform
  EKS_CLUSTER_NAME: demo-devops-eks
  ECR_REPOSITORY: demo-devops

jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      eks_cluster_name: ${{ steps.tf-outputs.outputs.eks_cluster }}
      ecr_repository: ${{ steps.tf-outputs.outputs.ecr_repo }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify Backend Exists
        id: check-backend
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="demo-devops-terraform-state-${ACCOUNT_ID}"
          TABLE_NAME="demo-devops-terraform-locks"
          
          echo "Checking for Terraform backend..."
          echo "Expected S3 Bucket: $BUCKET_NAME"
          echo "Expected DynamoDB Table: $TABLE_NAME"
          echo ""
          
          # Check S3 bucket
          if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "✓ S3 bucket exists"
            BUCKET_EXISTS=true
          else
            echo "✗ S3 bucket NOT found"
            BUCKET_EXISTS=false
          fi
          
          # Check DynamoDB table
          if aws dynamodb describe-table --table-name "$TABLE_NAME" --region ${{ env.AWS_REGION }} 2>/dev/null; then
            echo "✓ DynamoDB table exists"
            TABLE_EXISTS=true
          else
            echo "✗ DynamoDB table NOT found"
            TABLE_EXISTS=false
          fi
          
          echo ""
          if [ "$BUCKET_EXISTS" = false ] || [ "$TABLE_EXISTS" = false ]; then
            echo "❌ ERROR: Backend resources not found!"
            echo ""
            echo "Please run 'Terraform Backend Setup' workflow first:"
            echo "  1. Go to Actions → Terraform Backend Setup"
            echo "  2. Run workflow → action: setup"
            echo "  3. Wait for completion"
            echo "  4. Then run this workflow again"
            echo ""
            exit 1
          fi
          
          echo "✓ Backend is ready!"
          echo "backend_ready=true" >> $GITHUB_OUTPUT

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform plan
        if: inputs.action == 'apply'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -out=tfplan

      - name: Terraform apply
        if: inputs.action == 'apply'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan

      - name: Get Terraform Outputs
        if: inputs.action == 'apply'
        id: tf-outputs
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "eks_cluster=$(terraform output -raw eks_cluster_name)" >> $GITHUB_OUTPUT
          echo "ecr_repo=$(terraform output -raw ecr_repository_url)" >> $GITHUB_OUTPUT

      - name: Terraform destroy
        if: inputs.action == 'destroy'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform destroy -auto-approve

      - name: Post-Destroy Reminder
        if: inputs.action == 'destroy'
        run: |
          echo "## Infrastructure Destroyed Successfully! ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps (Optional)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "If you want to completely clean up (including backend):" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to **Actions** → **Terraform Backend Setup**" >> $GITHUB_STEP_SUMMARY
          echo "2. Run workflow → **action: destroy**" >> $GITHUB_STEP_SUMMARY
          echo "3. This will delete:" >> $GITHUB_STEP_SUMMARY
          echo "   - S3 bucket (terraform state)" >> $GITHUB_STEP_SUMMARY
          echo "   - DynamoDB table (state locks)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Note**: Destroying backend will erase all Terraform state history!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Current Status" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ EKS Infrastructure: Destroyed" >> $GITHUB_STEP_SUMMARY
          echo "- ⚠️ Backend: Still exists (~\$1/month)" >> $GITHUB_STEP_SUMMARY

  build-and-deploy:
    if: inputs.action == 'apply' && inputs.deploy_app == true
    needs: terraform
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build Docker image
          docker build -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG .
          docker build -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest .
          
          # Push image to ECR
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest
          
          echo "image=$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Deploy to EKS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Replace image in deployment
          export ECR_REPOSITORY_URL=$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}
          envsubst < k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml

      - name: Wait for deployment
        run: |
          kubectl rollout status deployment/demo-devops-app -n default --timeout=5m

      - name: Get Load Balancer URL
        id: get-url
        run: |
          echo "Waiting for Load Balancer to be provisioned..."
          for i in {1..30}; do
            LB_URL=$(kubectl get service demo-devops-service -n default -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
            if [ ! -z "$LB_URL" ]; then
              echo "url=$LB_URL" >> $GITHUB_OUTPUT
              echo "Application URL: http://$LB_URL"
              break
            fi
            echo "Attempt $i: Load Balancer not ready yet..."
            sleep 10
          done

      - name: Deployment Summary
        run: |
          echo "## EKS Deployment Successful! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Cluster Details" >> $GITHUB_STEP_SUMMARY
          echo "- **EKS Cluster**: ${{ env.EKS_CLUSTER_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **ECR Image**: ${{ steps.build-image.outputs.image }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Application URL**: http://${{ steps.get-url.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Kubernetes Resources" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          kubectl get pods -n default >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          kubectl get services -n default >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
