name: Terraform Backend Setup

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Setup or destroy backend infrastructure'
        required: true
        default: 'setup'
        type: choice
        options:
          - setup
          - destroy

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: ./Terraform

jobs:
  backend-setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create backend resources using AWS CLI
        if: inputs.action == 'setup'
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="demo-devops-terraform-state-${ACCOUNT_ID}"
          TABLE_NAME="demo-devops-terraform-locks"
          
          echo "========================================="
          echo "Setting up Terraform Backend"
          echo "========================================="
          echo "Bucket: $BUCKET_NAME"
          echo "Table: $TABLE_NAME"
          echo ""
          
          # Create S3 bucket
          echo "1. Creating S3 bucket..."
          if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "✓ Bucket already exists"
          else
            aws s3api create-bucket \
              --bucket "$BUCKET_NAME" \
              --region ${{ env.AWS_REGION }}
            echo "✓ Bucket created"
          fi
          
          # Enable versioning
          echo "2. Enabling versioning..."
          aws s3api put-bucket-versioning \
            --bucket "$BUCKET_NAME" \
            --versioning-configuration Status=Enabled
          echo "✓ Versioning enabled"
          
          # Enable encryption
          echo "3. Enabling encryption..."
          aws s3api put-bucket-encryption \
            --bucket "$BUCKET_NAME" \
            --server-side-encryption-configuration '{
              "Rules": [{
                "ApplyServerSideEncryptionByDefault": {
                  "SSEAlgorithm": "AES256"
                },
                "BucketKeyEnabled": true
              }]
            }'
          echo "✓ Encryption enabled"
          
          # Block public access
          echo "4. Blocking public access..."
          aws s3api put-public-access-block \
            --bucket "$BUCKET_NAME" \
            --public-access-block-configuration \
              BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          echo "✓ Public access blocked"
          
          # Create DynamoDB table
          echo "5. Creating DynamoDB table..."
          if aws dynamodb describe-table --table-name "$TABLE_NAME" 2>/dev/null; then
            echo "✓ Table already exists"
          else
            aws dynamodb create-table \
              --table-name "$TABLE_NAME" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region ${{ env.AWS_REGION }}
            echo "✓ Table created"
          fi
          
          # Enable point-in-time recovery
          echo "6. Enabling point-in-time recovery..."
          aws dynamodb update-continuous-backups \
            --table-name "$TABLE_NAME" \
            --point-in-time-recovery-specification PointInTimeRecoveryEnabled=true
          echo "✓ Point-in-time recovery enabled"
          
          echo ""
          echo "========================================="
          echo "✓ Backend setup complete!"
          echo "========================================="
          echo ""
          echo "Backend Configuration:"
          echo "  Bucket: $BUCKET_NAME"
          echo "  Table: $TABLE_NAME"
          echo "  Region: ${{ env.AWS_REGION }}"
          echo ""
          echo "Add this to Terraform backend.tf:"
          echo "terraform {"
          echo "  backend \"s3\" {"
          echo "    bucket         = \"$BUCKET_NAME\""
          echo "    key            = \"terraform.tfstate\""
          echo "    region         = \"${{ env.AWS_REGION }}\""
          echo "    encrypt        = true"
          echo "    dynamodb_table = \"$TABLE_NAME\""
          echo "  }"
          echo "}"

      - name: Destroy backend resources
        if: inputs.action == 'destroy'
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="demo-devops-terraform-state-${ACCOUNT_ID}"
          TABLE_NAME="demo-devops-terraform-locks"
          
          echo "========================================="
          echo "⚠️  WARNING: Destroying Backend Resources"
          echo "========================================="
          echo "This will delete:"
          echo "  - S3 Bucket: $BUCKET_NAME"
          echo "  - DynamoDB Table: $TABLE_NAME"
          echo "  - ALL TERRAFORM STATE FILES"
          echo ""
          
          # Empty and delete S3 bucket
          echo "1. Emptying S3 bucket..."
          aws s3 rm "s3://$BUCKET_NAME" --recursive || true
          
          echo "2. Deleting object versions..."
          aws s3api delete-objects \
            --bucket "$BUCKET_NAME" \
            --delete "$(aws s3api list-object-versions \
              --bucket "$BUCKET_NAME" \
              --output=json \
              --query='{Objects: Versions[].{Key:Key,VersionId:VersionId}}' 2>/dev/null || echo '{}')" 2>/dev/null || true
          
          aws s3api delete-objects \
            --bucket "$BUCKET_NAME" \
            --delete "$(aws s3api list-object-versions \
              --bucket "$BUCKET_NAME" \
              --output=json \
              --query='{Objects: DeleteMarkers[].{Key:Key,VersionId:VersionId}}' 2>/dev/null || echo '{}')" 2>/dev/null || true
          
          echo "3. Deleting S3 bucket..."
          aws s3api delete-bucket --bucket "$BUCKET_NAME" --region ${{ env.AWS_REGION }} || true
          echo "✓ Bucket deleted"
          
          echo "4. Deleting DynamoDB table..."
          aws dynamodb delete-table --table-name "$TABLE_NAME" --region ${{ env.AWS_REGION }} || true
          echo "✓ Table deleted"
          
          echo ""
          echo "========================================="
          echo "✓ Backend resources destroyed"
          echo "========================================="

      - name: Summary
        if: always()
        run: |
          echo "## Backend Setup ${{ inputs.action == 'setup' && 'Complete' || 'Destroyed' }}! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.action }}" == "setup" ]; then
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            echo "### Resources Created" >> $GITHUB_STEP_SUMMARY
            echo "- **S3 Bucket**: demo-devops-terraform-state-${ACCOUNT_ID}" >> $GITHUB_STEP_SUMMARY
            echo "- **DynamoDB Table**: demo-devops-terraform-locks" >> $GITHUB_STEP_SUMMARY
            echo "- **Encryption**: ✓ AES256" >> $GITHUB_STEP_SUMMARY
            echo "- **Versioning**: ✓ Enabled" >> $GITHUB_STEP_SUMMARY
            echo "- **Cost**: ~\$1/month" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
            echo "1. Backend is ready for Terraform" >> $GITHUB_STEP_SUMMARY
            echo "2. Run 'Terraform EKS + Deploy' workflow" >> $GITHUB_STEP_SUMMARY
            echo "3. Terraform will use this backend automatically" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Resources Destroyed" >> $GITHUB_STEP_SUMMARY
            echo "- S3 Bucket and DynamoDB table deleted" >> $GITHUB_STEP_SUMMARY
            echo "- All Terraform state files removed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **Warning**: You'll need to run 'backend-setup' again before using Terraform" >> $GITHUB_STEP_SUMMARY
          fi
