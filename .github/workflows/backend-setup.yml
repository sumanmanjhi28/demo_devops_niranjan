name: Terraform Backend Setup

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Setup or destroy backend infrastructure'
        required: true
        default: 'setup'
        type: choice
        options:
          - setup
          - destroy
      app_name:
        description: 'Application name (for resource naming)'
        required: false
        default: 'demo-devops'
        type: string

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: ./Terraform

jobs:
  backend-setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set resource names
        id: resources
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          APP_NAME="${{ inputs.app_name }}"
          BUCKET_NAME="${APP_NAME}-terraform-state-${ACCOUNT_ID}"
          TABLE_NAME="${APP_NAME}-terraform-locks"
          
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          echo "table_name=$TABLE_NAME" >> $GITHUB_OUTPUT
          
          echo "Resource Names:"
          echo "  AWS Account: $ACCOUNT_ID"
          echo "  App Name: $APP_NAME"
          echo "  S3 Bucket: $BUCKET_NAME"
          echo "  DynamoDB Table: $TABLE_NAME"

      - name: List existing backend resources
        run: |
          echo "========================================="
          echo "Existing Backend Resources"
          echo "========================================="
          
          # List S3 buckets matching pattern
          echo ""
          echo "S3 Buckets (terraform-state):"
          aws s3 ls | grep "terraform-state" || echo "  None found"
          
          # List DynamoDB tables matching pattern
          echo ""
          echo "DynamoDB Tables (terraform-locks):"
          aws dynamodb list-tables --region ${{ env.AWS_REGION }} \
            --query "TableNames[?contains(@, 'terraform-locks')]" \
            --output table || echo "  None found"
          
          echo ""
          echo "========================================="

      - name: Create backend resources using AWS CLI
        if: inputs.action == 'setup'
        run: |
          BUCKET_NAME="${{ steps.resources.outputs.bucket_name }}"
          TABLE_NAME="${{ steps.resources.outputs.table_name }}"
          
          echo "========================================="
          echo "Setting up Terraform Backend"
          echo "========================================="
          echo "Bucket: $BUCKET_NAME"
          echo "Table: $TABLE_NAME"
          echo ""
          
          # Create S3 bucket
          echo "1. Creating S3 bucket..."
          if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "✓ Bucket already exists"
          else
            aws s3api create-bucket \
              --bucket "$BUCKET_NAME" \
              --region ${{ env.AWS_REGION }}
            echo "✓ Bucket created"
          fi
          
          # Enable versioning
          echo "2. Enabling versioning..."
          aws s3api put-bucket-versioning \
            --bucket "$BUCKET_NAME" \
            --versioning-configuration Status=Enabled
          echo "✓ Versioning enabled"
          
          # Enable encryption
          echo "3. Enabling encryption..."
          aws s3api put-bucket-encryption \
            --bucket "$BUCKET_NAME" \
            --server-side-encryption-configuration '{
              "Rules": [{
                "ApplyServerSideEncryptionByDefault": {
                  "SSEAlgorithm": "AES256"
                },
                "BucketKeyEnabled": true
              }]
            }'
          echo "✓ Encryption enabled"
          
          # Block public access
          echo "4. Blocking public access..."
          aws s3api put-public-access-block \
            --bucket "$BUCKET_NAME" \
            --public-access-block-configuration \
              BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          echo "✓ Public access blocked"
          
          # Create DynamoDB table
          echo "5. Creating DynamoDB table..."
          if aws dynamodb describe-table --table-name "$TABLE_NAME" --region ${{ env.AWS_REGION }} 2>/dev/null; then
            echo "✓ Table already exists"
          else
            aws dynamodb create-table \
              --table-name "$TABLE_NAME" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region ${{ env.AWS_REGION }}
            echo "✓ Table created, waiting for it to be active..."
            
            # Wait for table to be active
            for i in {1..30}; do
              STATUS=$(aws dynamodb describe-table --table-name "$TABLE_NAME" --region ${{ env.AWS_REGION }} --query "Table.TableStatus" --output text 2>/dev/null || echo "")
              if [ "$STATUS" == "ACTIVE" ]; then
                echo "✓ Table is now active"
                break
              fi
              echo "  Waiting... (attempt $i/30)"
              sleep 5
            done
          fi
          
          # Enable point-in-time recovery
          echo "6. Enabling point-in-time recovery..."
          aws dynamodb update-continuous-backups \
            --table-name "$TABLE_NAME" \
            --point-in-time-recovery-specification PointInTimeRecoveryEnabled=true \
            --region ${{ env.AWS_REGION }} 2>/dev/null || echo "  Note: Point-in-time recovery may already be enabled"
          echo "✓ Point-in-time recovery enabled"
          
          echo ""
          echo "========================================="
          echo "✓ Backend setup complete!"
          echo "========================================="
          echo ""
          echo "Backend Configuration:"
          echo "  Bucket: $BUCKET_NAME"
          echo "  Table: $TABLE_NAME"
          echo "  Region: ${{ env.AWS_REGION }}"
          echo ""
          echo "Add this to Terraform backend.tf:"
          echo "terraform {"
          echo "  backend \"s3\" {"
          echo "    bucket         = \"$BUCKET_NAME\""
          echo "    key            = \"terraform.tfstate\""
          echo "    region         = \"${{ env.AWS_REGION }}\""
          echo "    encrypt        = true"
          echo "    dynamodb_table = \"$TABLE_NAME\""
          echo "  }"
          echo "}"

      - name: Destroy backend resources
        if: inputs.action == 'destroy'
        run: |
          BUCKET_NAME="${{ steps.resources.outputs.bucket_name }}"
          TABLE_NAME="${{ steps.resources.outputs.table_name }}"
          
          echo "========================================="
          echo "⚠️  WARNING: Destroying Backend Resources"
          echo "========================================="
          echo "This will delete:"
          echo "  - S3 Bucket: $BUCKET_NAME"
          echo "  - DynamoDB Table: $TABLE_NAME"
          echo "  - ALL TERRAFORM STATE FILES"
          echo ""
          
          # Check if resources exist
          echo "Checking if resources exist..."
          BUCKET_EXISTS=$(aws s3api head-bucket --bucket "$BUCKET_NAME" 2>&1 || echo "not-found")
          TABLE_EXISTS=$(aws dynamodb describe-table --table-name "$TABLE_NAME" --region ${{ env.AWS_REGION }} 2>&1 || echo "not-found")
          
          if [[ "$BUCKET_EXISTS" == *"not-found"* ]] && [[ "$TABLE_EXISTS" == *"not-found"* ]]; then
            echo "⚠️  No backend resources found to delete!"
            echo "  Bucket: $BUCKET_NAME - Not found"
            echo "  Table: $TABLE_NAME - Not found"
            exit 0
          fi
          
          # Empty and delete S3 bucket
          echo "1. Emptying S3 bucket..."
          aws s3 rm "s3://$BUCKET_NAME" --recursive || true
          
          echo "2. Deleting object versions..."
          aws s3api delete-objects \
            --bucket "$BUCKET_NAME" \
            --delete "$(aws s3api list-object-versions \
              --bucket "$BUCKET_NAME" \
              --output=json \
              --query='{Objects: Versions[].{Key:Key,VersionId:VersionId}}' 2>/dev/null || echo '{}')" 2>/dev/null || true
          
          aws s3api delete-objects \
            --bucket "$BUCKET_NAME" \
            --delete "$(aws s3api list-object-versions \
              --bucket "$BUCKET_NAME" \
              --output=json \
              --query='{Objects: DeleteMarkers[].{Key:Key,VersionId:VersionId}}' 2>/dev/null || echo '{}')" 2>/dev/null || true
          
          echo "3. Deleting S3 bucket..."
          aws s3api delete-bucket --bucket "$BUCKET_NAME" --region ${{ env.AWS_REGION }} || true
          echo "✓ Bucket deleted"
          
          echo "4. Deleting DynamoDB table..."
          aws dynamodb delete-table --table-name "$TABLE_NAME" --region ${{ env.AWS_REGION }} || true
          echo "✓ Table deleted"
          
          echo ""
          echo "========================================="
          echo "✓ Backend resources destroyed"
          echo "========================================="

      - name: Summary
        if: always()
        run: |
          BUCKET_NAME="${{ steps.resources.outputs.bucket_name }}"
          TABLE_NAME="${{ steps.resources.outputs.table_name }}"
          ACCOUNT_ID="${{ steps.resources.outputs.account_id }}"
          
          echo "## Backend ${{ inputs.action == 'setup' && 'Setup' || 'Destruction' }} Complete! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Resource Details" >> $GITHUB_STEP_SUMMARY
          echo "- **AWS Account**: $ACCOUNT_ID" >> $GITHUB_STEP_SUMMARY
          echo "- **App Name**: ${{ inputs.app_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **S3 Bucket**: $BUCKET_NAME" >> $GITHUB_STEP_SUMMARY
          echo "- **DynamoDB Table**: $TABLE_NAME" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.action }}" == "setup" ]; then
            echo "### Resources Created" >> $GITHUB_STEP_SUMMARY
            echo "- ✓ S3 Bucket for Terraform state" >> $GITHUB_STEP_SUMMARY
            echo "- ✓ DynamoDB Table for state locking" >> $GITHUB_STEP_SUMMARY
            echo "- ✓ Encryption: AES256" >> $GITHUB_STEP_SUMMARY
            echo "- ✓ Versioning: Enabled" >> $GITHUB_STEP_SUMMARY
            echo "- ✓ Cost: ~\$1/month" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Backend Configuration" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`hcl" >> $GITHUB_STEP_SUMMARY
            echo "terraform {" >> $GITHUB_STEP_SUMMARY
            echo "  backend \"s3\" {" >> $GITHUB_STEP_SUMMARY
            echo "    bucket         = \"$BUCKET_NAME\"" >> $GITHUB_STEP_SUMMARY
            echo "    key            = \"terraform.tfstate\"" >> $GITHUB_STEP_SUMMARY
            echo "    region         = \"${{ env.AWS_REGION }}\"" >> $GITHUB_STEP_SUMMARY
            echo "    encrypt        = true" >> $GITHUB_STEP_SUMMARY
            echo "    dynamodb_table = \"$TABLE_NAME\"" >> $GITHUB_STEP_SUMMARY
            echo "  }" >> $GITHUB_STEP_SUMMARY
            echo "}" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
            echo "1. Backend is ready for Terraform" >> $GITHUB_STEP_SUMMARY
            echo "2. Update \`backend.tf\` with the configuration above" >> $GITHUB_STEP_SUMMARY
            echo "3. Run 'Terraform EKS + Deploy' workflow" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Resources Destroyed" >> $GITHUB_STEP_SUMMARY
            echo "- ✓ S3 Bucket deleted" >> $GITHUB_STEP_SUMMARY
            echo "- ✓ DynamoDB Table deleted" >> $GITHUB_STEP_SUMMARY
            echo "- ✓ All Terraform state files removed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **Warning**: Run 'setup' action to recreate backend before using Terraform" >> $GITHUB_STEP_SUMMARY
          fi
